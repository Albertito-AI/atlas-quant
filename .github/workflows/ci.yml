name: Tests and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Check repository policy
        run: python scripts/security_check.py
      - name: Run numerical, accounting and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Validate installed dependencies
        run: python -m pip check

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build frontend
        run: python -m pip install build==1.6.1
      - name: Build source archive and wheel
        run: python -m build
      - name: Verify wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/atlas-wheel"
          "$RUNNER_TEMP/atlas-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/atlas-wheel/bin/python" -c "import atlas_quant; from atlas_quant.quant import black_scholes; assert abs(black_scholes(100,100,1,.05,.2)-10.450583572185565) < 1e-8"
          "$RUNNER_TEMP/atlas-wheel/bin/atlas-quant" --help
