name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve runtime dependencies
        run: |
          python -m pip install .
          python -m pip freeze --exclude atlas-quant-research > "$RUNNER_TEMP/runtime-requirements.txt"
      - name: Install dependency auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Check resolved runtime against published advisories
        run: python -m pip_audit --no-deps --disable-pip -r "$RUNNER_TEMP/runtime-requirements.txt" --progress-spinner off
