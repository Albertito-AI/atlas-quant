<rect x="595.000" y="190.000" width="345.000" height="310.000" fill="#ffffff" rx="5"/>
<line x1="595.000" y1="500.000" x2="940.000" y2="500.000" stroke="#dce4e9" stroke-width="1"/>
<text x="583.00" y="504.00" font-size="11" fill="#52677a" text-anchor="end" font-weight="400">0.0k</text>
