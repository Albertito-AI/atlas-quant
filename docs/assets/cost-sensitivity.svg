<text x="231.43" y="523.00" font-size="11" fill="#52677a" text-anchor="middle" font-weight="400">10</text>
<line x1="313.571" y1="500.000" x2="313.571" y2="505.000" stroke="#dce4e9" stroke-width="1"/>
