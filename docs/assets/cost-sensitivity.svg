<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" role="img" aria-labelledby="title desc">
<title id="title">Costs change the result</title><desc id="desc">Two bar charts show final wealth and total fees for zero, ten, twenty-five and fifty basis points per side. Fee sums differ from the final-wealth difference because cash flows compound differently.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif} .muted{fill:#52677a}</style>
<rect width="1040" height="680" rx="18" fill="#f7f9fb"/>
<rect x="0" y="0" width="1040" height="8" fill="#007f80"/>
<text x="36.00" y="39.00" font-size="12" fill="#007f80" text-anchor="start" font-weight="700">ATLAS QUANT  /  FINANCIAL VISUAL ATLAS</text>
<text x="36.00" y="76.00" font-size="27" fill="#162c42" text-anchor="start" font-weight="700">Costs change the result</text>
<text x="36.00" y="103.00" font-size="13" fill="#52677a" text-anchor="start" font-weight="400">SYNTHETIC DATA  ·  One fixed path and strategy  ·  Only the per-side fee changes</text>
<text x="100.00" y="172.00" font-size="16" fill="#162c42" text-anchor="start" font-weight="700">Final portfolio wealth</text>
<rect x="100.000" y="190.000" width="345.000" height="310.000" fill="#ffffff" rx="5"/>
<line x1="100.000" y1="500.000" x2="445.000" y2="500.000" stroke="#dce4e9" stroke-width="1"/>
