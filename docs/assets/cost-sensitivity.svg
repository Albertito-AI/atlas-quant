<text x="88.00" y="426.50" font-size="11" fill="#52677a" text-anchor="end" font-weight="400">25.0k</text>
<line x1="100.000" y1="345.000" x2="445.000" y2="345.000" stroke="#dce4e9" stroke-width="1"/>
<text x="88.00" y="349.00" font-size="11" fill="#52677a" text-anchor="end" font-weight="400">50.0k</text>
<line x1="100.000" y1="267.500" x2="445.000" y2="267.500" stroke="#dce4e9" stroke-width="1"/>
<text x="88.00" y="271.50" font-size="11" fill="#52677a" text-anchor="end" font-weight="400">75.0k</text>
