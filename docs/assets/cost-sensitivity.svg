<line x1="890.714" y1="500.000" x2="890.714" y2="505.000" stroke="#dce4e9" stroke-width="1"/>
<text x="890.71" y="523.00" font-size="11" fill="#52677a" text-anchor="middle" font-weight="400">50</text>
<text x="767.50" y="548.00" font-size="12" fill="#162c42" text-anchor="middle" font-weight="400">Per-side cost (basis points)</text>
<text x="540.00" y="345.00" font-size="12" fill="#162c42" text-anchor="middle" font-weight="400" transform="rotate(-90 540 345.0)">Currency units</text>
<rect x="620.286" y="500.000" width="48.000" height="0.000" fill="#be581d" rx="3"/>
<text x="644.29" y="488.00" font-size="12" fill="#162c42" text-anchor="middle" font-weight="700">0</text>
<rect x="702.429" y="448.252" width="48.000" height="51.748" fill="#be581d" rx="3"/>
<text x="726.43" y="436.25" font-size="12" fill="#162c42" text-anchor="middle" font-weight="700">334</text>
<rect x="784.571" y="371.009" width="48.000" height="128.991" fill="#be581d" rx="3"/>
<text x="808.57" y="359.01" font-size="12" fill="#162c42" text-anchor="middle" font-weight="700">832</text>
<rect x="866.714" y="243.261" width="48.000" height="256.739" fill="#be581d" rx="3"/>
<text x="890.71" y="231.26" font-size="12" fill="#162c42" text-anchor="middle" font-weight="700">1,656</text>
<line x1="36.000" y1="605.000" x2="1004.000" y2="605.000" stroke="#dce4e9" stroke-width="1"/>
<text x="36.00" y="629.00" font-size="11" fill="#52677a" text-anchor="start" font-weight="400">Both purchases and sales incur fees on gross traded notional. Each scenario reruns the self-financing ledger.</text>
<text x="36.00" y="648.00" font-size="11" fill="#52677a" text-anchor="start" font-weight="400">The wealth difference includes compounding effects; it is not identical to the sum of fees. No liquidity or market-impact model.</text>
</svg>
