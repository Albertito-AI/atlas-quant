<text x="583.00" y="271.50" font-size="11" fill="#52677a" text-anchor="end" font-weight="400">1.5k</text>
<line x1="595.000" y1="190.000" x2="940.000" y2="190.000" stroke="#dce4e9" stroke-width="1"/>
<text x="583.00" y="194.00" font-size="11" fill="#52677a" text-anchor="end" font-weight="400">2.0k</text>
