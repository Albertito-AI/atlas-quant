<text x="100.00" y="607.00" font-size="13" fill="#162c42" text-anchor="start" font-weight="400">Current CVaR budget: 2.0%. Current normalised regime-entropy limit: 0.95.</text>
<line x1="36.000" y1="675.000" x2="1004.000" y2="675.000" stroke="#dce4e9" stroke-width="1"/>
<text x="36.00" y="699.00" font-size="11" fill="#52677a" text-anchor="start" font-weight="400">Bars are candidate budgets; the line is max(fitted, held-out) worst-scenario CVaR for fixed weights. This sweep isolates one gate.</text>
<text x="36.00" y="718.00" font-size="11" fill="#52677a" text-anchor="start" font-weight="400">The full outcome also applies evidence and uncertainty checks. Passing a gate permits research review only; it cannot approve a trade.</text>
