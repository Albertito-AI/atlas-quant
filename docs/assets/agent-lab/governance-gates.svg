<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="750" viewBox="0 0 1040 750" role="img" aria-labelledby="title desc">
<title id="title">05  A calculation can still require abstention</title><desc id="desc">Risk-budget sensitivity shows whether the tail-risk gate passes for the same robust allocation. The complete outcome also depends on the other recorded gates and never authorises a trade.</desc>
